services:
  db:
    image: postgres:16
    container_name: taskflow-db

    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123
      POSTGRES_DB: taskflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: taskflow-api

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://taskflow:taskflow123@db:5432/taskflow
      SECRET_KEY: taskflow-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

volumes:
  postgres_data: